name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: تنظيف الملفات المؤقتة القديمة
        run: flutter clean

      - name: تثبيت الاعتماديات
        run: flutter pub get

      - name: توليد أيقونة التطبيق
        run: flutter pub run flutter_launcher_icons

      - name: فك تشفير مفتاح التوقيع (إن وُجد)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: بناء ملف APK
        run: flutter build apk --release
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: رفع APK كملف تنزيل (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MN-Doc-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # عند دفع "تاغ" إصدار مثل v1.0.1، ينشر APK كإصدار عام (Release) على GitHub
      # يستطيع أي شخص تنزيله مباشرة — وهذا ما تستخدمه ميزة "التحقق من التحديثات".
      - name: نشر إصدار عام (فقط عند دفع تاغ إصدار)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
